<mat-sidenav-container class="sidenav-container">

  <!-- Mobile Sidenav -->
  <mat-sidenav #sidenav mode="over" class="mobile-sidenav">
    <nav class="mobile-menu-buttons">
      <button mat-button routerLink="/" (click)="sidenav.close()">Home</button>
      <button mat-button routerLink="/about" (click)="sidenav.close()">About</button>
      <button mat-button routerLink="/projects" (click)="sidenav.close()">Projects</button>
      <button mat-button routerLink="/contact" (click)="sidenav.close()">Contact</button>
    </nav>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content *ngIf="iconRegistered">
    <app-navbar [sidenav]="sidenav"></app-navbar>

    <main class="page">
      <router-outlet></router-outlet>
    </main>

    <app-footer></app-footer>
  </mat-sidenav-content>

</mat-sidenav-container>
