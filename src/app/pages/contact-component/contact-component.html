<section class="contact-section">
    <h2>Contact Me</h2>

    <div class="contact-card">
        <div class="contact-details">
            <p><strong>Email: </strong><a [href]="emailLink">{{email}}</a></p>
            <p><strong>Phone: </strong><a [href]="telToLink">{{tel}}</a></p>
            <p><strong>GitHub: </strong><a [href]="githubUrl" target="_blank">{{github}}</a></p>
            <p><strong>LinkedIn: </strong><a [href]="linkedInUrl" target="_blank">{{linkedIn}}</a></p>
        </div>

        <div class="social-icons">
            <a [href]="githubUrl" target="_blank">
                <mat-icon svgIcon="github"></mat-icon>
            </a>
            <a [href]="linkedInUrl" target="_blank">
                <mat-icon svgIcon="linkedin"></mat-icon>
            </a>
            <a [href]="emailLink">
                <mat-icon svgIcon="email"></mat-icon>
            </a>
        </div>

        <div class="resume-download">
            <a href="assets/resume.pdf" download>
            <button mat-raised-button color="accent">
                <mat-icon>download</mat-icon> Download Resume
            </button>
            </a>
        </div>
    </div>

    
</section>
