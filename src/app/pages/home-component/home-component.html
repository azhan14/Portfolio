<section class="home-container">
  <div class="profile-image">
    <img src="assets/profile.jpg" alt="Profile Image">
  </div>

  <div class="hero-content">
    <h1>Hi, I'm <span class="name">Azhan Patel</span></h1>
    <h3 class="subtitle">Software Engineer | Java | Spring Boot | Angular | Full-Stack Developer | Microservices | REST APIs | SQL | Azure Certified (AZ-900)</h3>
  
    <!-- Social Icons -->
    <div class="social-icons">
      <a [href]="githubUrl" target="_blank">
        <mat-icon svgIcon="github"></mat-icon>
      </a>
      <a [href]="linkedInUrl" target="_blank">
        <mat-icon svgIcon="linkedin"></mat-icon>
      </a>
      <a [href]="emailAddress">
        <mat-icon svgIcon="email"></mat-icon>
      </a>
    </div>
  </div>
</section>
